<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بيمو سواب</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & ReactDOM (UMD versions for browser usage) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* إضافة الأنماط المخصصة والتأثيرات الحركية (Animations) */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse-custom {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.1); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-in-up { animation: slideInUp 0.7s ease-out forwards; }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        .animate-pulse-custom { animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        /* تخصيص الـ Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* إزالة أسهم الأرقام من حقل الإدخال */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        
        /* منع التحديد والنسخ غير المرغوب فيه في الموبايل */
        * { -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #020202;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // تهيئة بيئة التليجرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // جعل التطبيق يأخذ الشاشة كاملة
        
        // جلب بيانات المستخدم من تليجرام
        const tgUser = tg.initDataUnsafe?.user || { id: 0, username: 'Guest', first_name: 'ضيف' };

        const translations = {
            ar: {
                status: "الحالة: متوفر وسريع دائماً",
                title: "بيمو سواب",
                subTitle: "Bimo Swap",
                send: "أرسل عبر",
                receive: "استلم عبر",
                starsAmount: "عدد النجوم",
                usdAmount: "المبلغ بالدولار ($)",
                netAmount: "المبلغ الصافي لك",
                afterFees: "بعد الرسوم",
                transferData: "بيانات التحويل",
                copy: "نسخ العنوان",
                copied: "تم النسخ!",
                screenshot: "لقطة شاشة",
                txId: "رقم العملية (ID)",
                receivingInfo: "بيانات استلامك",
                confirm: "تأكيد الإرسال",
                placeholder: "رقم الحساب أو المحفظة...",
                errorWallet: "يرجى إدخال عنوان المحفظة أو الحساب للاستلام",
                errorProof: "يرجى رفع صورة الإثبات أو كتابة رقم العملية (ID)",
                errorAmount: "يرجى إدخال مبلغ صحيح",
                errorMinStandard: "عذراً، أقل مبلغ صافي للاستلام لهذه الطريقة هو 5$",
                errorMinInsta: "عذراً، أقل مبلغ صافي للاستلام لـ InstaPay هو 2$",
                successMsg: "تم استلام طلبك بنجاح! راجع البوت.",
                calcFee: "الرسوم",
                calcTime: "الوقت المقدر",
                calcRate: "سعر الصرف",
                timeValue: "5 - 30 دقيقة",
                fixedFeeNote: "رسوم إضافية: 0.5$ (خدمة)",
                fixedFeeNoteInsta: "رسوم إضافية: 0.2$ (خدمة)",
                minAmountNote: "الحد الأدنى للصافي: 5$",
                minAmountNoteInsta: "الحد الأدنى للصافي: 2$",
                // إضافات جديدة للتبويبات والاتصال بالباكيند
                navSwap: "التبديل",
                navHistory: "السجل",
                navReferral: "الإحالة",
                historyTitle: "سجل الطلبات",
                statusPending: "قيد المراجعة",
                statusCompleted: "مكتمل",
                statusFailed: "مرفوض",
                referralTitle: "نظام الإحالة",
                referralDesc: "انسخ الرابط وشاركه مع أصدقائك للحصول على مكافآت!",
                copyLink: "نسخ رابط الدعوة",
                myReferrals: "الأصدقاء المدعوين",
                noReferrals: "لم تقم بدعوة أحد بعد",
                noHistory: "لا توجد طلبات سابقة"
            }
        };

        const BimoLogo = ({ size = 42 }) => (
            <div className="relative flex items-center justify-center">
                <div className="absolute inset-0 bg-blue-500/30 blur-xl rounded-full"></div>
                <img 
                src="https://up6.cc/2026/05/177817395989891.jpg" 
                alt="Bimo Logo" 
                className="relative z-10 object-cover rounded-2xl border border-white/20 shadow-2xl"
                style={{ width: size, height: size }}
                />
            </div>
        );

        // مكون لإنشاء الأيقونات باستخدام Lucide
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide[name]) {
                    iconRef.current.innerHTML = '';
                    const svg = document.createElement('i');
                    svg.setAttribute('data-lucide', name);
                    iconRef.current.appendChild(svg);
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size, className]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        const MethodIcon = ({ id, size = 28 }) => {
            const imgStyle = { width: size, height: size, borderRadius: size/4, objectFit: 'cover' };
            const badgeStyle = { 
                width: size * 0.45, height: size * 0.45, borderRadius: '50%', 
                border: '1.5px solid black', position: 'absolute', bottom: -2, right: -2,
                objectFit: 'cover', backgroundColor: 'black'
            };
            
            const UsdtMainLogo = () => (
                <div className="bg-[#26A17B] rounded-full flex items-center justify-center text-white font-bold shadow-lg" style={{width: size, height: size, fontSize: size*0.55}}>$</div>
            );

            switch (id) {
                case 'stars': return <Icon name="Star" size={size} className="text-yellow-400 fill-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.4)]" />;
                case 'usdt_ton': return <div className="relative" style={{ width: size, height: size }}><UsdtMainLogo /><img src="https://up6.cc/2026/05/177817200499771.jpg" style={badgeStyle} /></div>;
                case 'usdt_bnb': return <div className="relative" style={{ width: size, height: size }}><UsdtMainLogo /><img src="https://up6.cc/2026/05/177817190244111.jpg" style={badgeStyle} /></div>;
                case 'faucetpay': return <div className="bg-blue-500 rounded-lg flex items-center justify-center text-white font-black" style={{width: size, height: size, fontSize: size*0.4}}>FP</div>;
                case 'binance': return <img src="https://up6.cc/2026/05/177817190244111.jpg" style={imgStyle} />;
                case 'cwallet': return <img src="https://up6.cc/2026/05/177817196567581.jpg" style={imgStyle} />;
                case 'ton': return <img src="https://up6.cc/2026/05/177817200499771.jpg" style={imgStyle} />;
                case 'vodafone': return <img src="https://up6.cc/2026/05/177818331530571.jpeg" style={imgStyle} />;
                case 'asiapay': return <img src="https://up6.cc/2026/05/17781834516841.jpeg" style={imgStyle} />;
                case 'paysera': return <img src="https://up6.cc/2026/05/17781903678191.png" style={imgStyle} />;
                case 'bkash': return <img src="https://up6.cc/2026/05/177824587778081.jpeg" style={imgStyle} />;
                case 'zaincash': return <img src="https://up6.cc/2026/05/17782464670791.png" style={imgStyle} />;
                case 'instapay': return <img src="https://up6.cc/2026/05/17782470391531.png" style={imgStyle} />;
                case 'mexc': return <div style={{ width: size, height: size }} className="bg-white rounded-lg flex items-center justify-center p-1"><svg viewBox="0 0 100 100" className="w-full h-full"><path d="M15 80 L35 25 L50 55 L65 25 L85 80" fill="none" stroke="#0052ff" strokeWidth="18" strokeLinecap="round" strokeLinejoin="round" /></svg></div>;
                default: return <Icon name="Wallet" size={size} />;
            }
        };

        const App = () => {
            const BACKEND_URL = "https://none-namespace-smith-andrea.trycloudflare.com";
            // حالة التبويبات النشطة (swap | history | referral)
            const [currentTab, setCurrentTab] = useState('swap');

            const [amountInput, setAmountInput] = useState('');
            const [sendMethod, setSendMethod] = useState('stars');
            const [receiveMethod, setReceiveMethod] = useState('usdt_ton');
            const [userReceiveInfo, setUserReceiveInfo] = useState('');
            const [txId, setTxId] = useState('');
            const [screenshot, setScreenshot] = useState(null);
            const [loading, setLoading] = useState(false);
            const [modalOpen, setModalOpen] = useState(null);
            const [toast, setToast] = useState({ show: false, msg: '', type: 'error' });
            const fileInputRef = useRef(null);

            // الحالات الديناميكية القادمة مباشرة من الباكيند (Live State)
            const [rates, setRates] = useState({
                vodafone: 50.0,
                instapay: 55.0,
                asiapay: 1310.0,
                zaincash: 1750.0,
                bkash: 150.0,
                stars: 0.01
            });
            const [history, setHistory] = useState([]);
            const [referrals, setReferrals] = useState([]);

            const t = translations['ar']; 
            const isStarsInput = sendMethod === 'stars';

            // جلب وتحديث الأسعار والسجل الحقيقي والإحالات دورياً من الباكيند (Live Polling كل 8 ثواني)
            useEffect(() => {
                const fetchRates = async () => {
                    try {
                        const response = await fetch(`${BACKEND_URL}/api/rates`);
                        if (response.ok) {
                            const data = await response.json();
                            setRates(data);
                        }
                    } catch (err) {
                        console.error("Error fetching live rates:", err);
                    }
                };

                const fetchHistory = async () => {
                    if (!tgUser.id) return;
                    try {
                        const response = await fetch(`${BACKEND_URL}/api/history/${tgUser.id}`);
                        if (response.ok) {
                            const data = await response.json();
                            setHistory(data);
                        }
                    } catch (err) {
                        console.error("Error fetching live history:", err);
                    }
                };

                const fetchReferrals = async () => {
                    if (!tgUser.id) return;
                    try {
                        const response = await fetch(`${BACKEND_URL}/api/referrals/${tgUser.id}`);
                        if (response.ok) {
                            const data = await response.json();
                            setReferrals(data);
                        }
                    } catch (err) {
                        console.error("Error fetching live referrals:", err);
                    }
                };

                // التشغيل الأولي الفوري عند فتح الميني أب
                fetchRates();
                fetchHistory();
                fetchReferrals();

                // جدولة جلب البيانات لايف كل 8 ثواني
                const interval = setInterval(() => {
                    fetchRates();
                    fetchHistory();
                }, 8000);

                return () => clearInterval(interval);
            }, [tgUser.id]);

            const calculateGross = () => {
                if (!amountInput || isNaN(amountInput)) return 0;
                const val = parseFloat(amountInput);
                return isStarsInput ? val * (rates.stars || 0.01) : val;
            };
            
            const getFeeSettings = () => {
                if (receiveMethod === 'instapay') return { percentage: 0.03, fixed: 0.2 };
                const hasFixedFee = ['vodafone', 'asiapay', 'paysera', 'bkash', 'zaincash'].includes(receiveMethod);
                if (hasFixedFee) return { percentage: 0.03, fixed: 0.5 };
                return { percentage: 0.15, fixed: 0 };
            };

            const calculateFee = () => {
                const settings = getFeeSettings();
                return (calculateGross() * settings.percentage) + settings.fixed;
            };

            const calculateNetUSD = () => {
                const net = calculateGross() - calculateFee();
                return net > 0 ? net : 0;
            };

            // حساب المبالغ بالاعتماد الكامل والحي على الأسعار المخزنة في قاعدة البيانات
            const getDisplayAmount = () => {
                const usd = calculateNetUSD();
                if (receiveMethod === 'vodafone') return `${(usd * (rates.vodafone || 50)).toLocaleString(undefined, {maximumFractionDigits: 2})} EGP`;
                if (receiveMethod === 'instapay') return `${(usd * (rates.instapay || 55)).toLocaleString(undefined, {maximumFractionDigits: 2})} EGP`;
                if (receiveMethod === 'asiapay') return `${(usd * (rates.asiapay || 1310)).toLocaleString(undefined, {maximumFractionDigits: 0})} IQD`;
                if (receiveMethod === 'zaincash') return `${(usd * (rates.zaincash || 1750)).toLocaleString(undefined, {maximumFractionDigits: 0})} IQD`;
                if (receiveMethod === 'bkash') return `${(usd * (rates.bkash || 150)).toLocaleString(undefined, {maximumFractionDigits: 0})} ৳`;
                return `${usd.toFixed(3)} USD`;
            };

            const sendMethods = {
                stars: { name: "Telegram Stars", isStar: true },
                usdt_ton: { name: "USDT (TON)", address: "EQCxxxxxxxxxxxxxxxxxxxxxxxxxxxx" },
                usdt_bnb: { name: "USDT (BEP20)", address: "0x7xxxxxxxxxxxxxxxxxxxxxxxxxxxx" },
                faucetpay: { name: "FaucetPay", address: "bimo_swap@fpay.com" },
                ton: { name: "TON", address: "UQxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" },
                binance: { name: "Binance Pay", address: "Pay ID: 558900122" },
                mexc: { name: "MEXC", address: "MEXC ID: 11022933" },
                cwallet: { name: "C-Wallet", address: "C-ID: CW77821" }
            };

            const receiveMethods = {
                usdt_ton: { name: "USDT (TON)" }, usdt_bnb: { name: "USDT (BEP20)" },
                faucetpay: { name: "FaucetPay" }, ton: { name: "TON" },
                vodafone: { name: "Vodafone Cash" }, instapay: { name: "InstaPay" },
                asiapay: { name: "AsiaPay (IQD)" }, zaincash: { name: "Zain Cash (IQD)" },
                paysera: { name: "Paysera" }, bkash: { name: "Bkash (৳)" },
                cwallet: { name: "C-Wallet" }, mexc: { name: "MEXC" }
            };

            const showToast = (msg, type = 'error') => {
                setToast({ show: true, msg, type });
                setTimeout(() => setToast({ show: false, msg: '', type: 'error' }), 3000);
            };

            const handleCopy = (text) => {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text);
                } else {
                    let textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try { document.execCommand('copy'); } catch (err) { }
                    document.body.removeChild(textArea);
                }
                showToast(t.copied, 'success');
            };

            const handleProcess = async () => {
                const netAmount = calculateNetUSD();
                if (!amountInput || parseFloat(amountInput) <= 0) { showToast(t.errorAmount); return; }
                if (receiveMethod === 'instapay' && netAmount < 2) { showToast(t.errorMinInsta); return; }
                const fixedFeeMethods = ['vodafone', 'asiapay', 'paysera', 'bkash', 'zaincash'];
                if (fixedFeeMethods.includes(receiveMethod) && netAmount < 5) { showToast(t.errorMinStandard); return; }
                if (!userReceiveInfo.trim()) { showToast(t.errorWallet); return; }
                if (!sendMethods[sendMethod].isStar && !screenshot && !txId.trim()) { showToast(t.errorProof); return; }

                setLoading(true);
                
                // جلب معرف الإحالة إذا كان المستخدم مسجلاً عبر رابط دعوة أصدقاء
                const startParam = tg.initDataUnsafe?.start_param;
                const referred_by = (startParam && !isNaN(startParam)) ? parseInt(startParam) : null;

                const payload = {
                    tg_id: tgUser.id,
                    username: tgUser.username || 'Guest',
                    first_name: tgUser.first_name || 'ضيف',
                    amount_sent: parseFloat(amountInput),
                    send_method: sendMethods[sendMethod].name,
                    receive_method: receiveMethods[receiveMethod].name,
                    receive_wallet: userReceiveInfo,
                    net_amount_usd: netAmount,
                    tx_id: txId || 'None',
                    referred_by: referred_by
                };

                try {
                    const response = await fetch(`${BACKEND_URL}/api/submit-order`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        showToast(t.successMsg, 'success');
                        setAmountInput('');
                        setUserReceiveInfo('');
                        setTxId('');
                        setScreenshot(null);
                        // التبديل فورياً إلى صفحة السجل الحية لرؤية تفاصيل الطلب قيد الانتظار
                        setCurrentTab('history');
                    } else {
                        showToast("حدث خطأ في الخادم، يرجى المحاولة لاحقاً");
                    }
                } catch (error) {
                    showToast("فشل الاتصال بالخادم!");
                } finally {
                    setLoading(false);
                }
            };

            // رابط الدعوة الخاص بالمستخدم الفعلي
            const referralLink = `https://t.me/BimoSwap_Bot?start=${tgUser.id || '0'}`;

            return (
                <div className="min-h-screen pb-24">
                    
                    {/* Toast Alert */}
                    <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-[120] w-[90%] max-w-xs transition-all duration-500 transform ${toast.show ? 'translate-y-0 opacity-100 scale-100' : '-translate-y-12 opacity-0 scale-90 pointer-events-none'}`}>
                        <div className={`p-4 rounded-3xl border backdrop-blur-2xl shadow-2xl flex items-center gap-3 ${toast.type === 'success' ? 'bg-green-500/10 border-green-500/20 text-green-400' : 'bg-red-500/10 border-red-500/20 text-red-400'}`}>
                            <div className="p-1.5 rounded-full bg-current/20">
                                {toast.type === 'success' ? <Icon name="CheckCircle2" size={16} /> : <Icon name="AlertCircle" size={16} />}
                            </div>
                            <p className="text-[11px] font-black flex-1 leading-tight">{toast.msg}</p>
                        </div>
                    </div>

                    {/* Header */}
                    <header className="p-5 bg-black/40 backdrop-blur-2xl border-b border-white/5 sticky top-0 z-[60] flex justify-between items-center w-full">
                        <div className="flex items-center gap-3">
                            <BimoLogo size={46} />
                            <div className="flex flex-col">
                                <h1 className="text-xl font-black tracking-tight leading-none text-white">{t.title}</h1>
                                <span className="text-[9px] font-bold text-blue-500 uppercase tracking-widest">{t.subTitle}</span>
                            </div>
                        </div>
                        <a href="https://t.me/YOUR_SUPPORT_LINK" target="_blank" className="bg-white/5 border border-white/10 p-2.5 rounded-xl text-blue-400 hover:bg-white/10 transition-all shadow-inner">
                            <Icon name="Headset" size={18} />
                        </a>
                    </header>

                    {/* Main Content */}
                    <main className="p-5 max-w-md mx-auto space-y-4 pt-4">
                        
                        {/* -------------------- TAB: SWAP (التبديل) -------------------- */}
                        {currentTab === 'swap' && (
                            <div className="space-y-4 animate-fade-in">
                                <div className="bg-blue-600/5 border border-blue-500/10 py-2 rounded-full text-center flex items-center justify-center gap-2">
                                    <div className="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse-custom"></div>
                                    <span className="text-[9px] font-black text-blue-400 uppercase tracking-[0.2em]">{t.status}</span>
                                </div>

                                {/* Send Method */}
                                <button onClick={() => setModalOpen('send')} className="w-full bg-[#0a0a0a] border border-white/10 p-5 rounded-[2.2rem] flex items-center justify-between hover:bg-white/[0.04] transition-all active:scale-[0.98]">
                                    <div className="flex items-center gap-4 text-right">
                                        <MethodIcon id={sendMethod} size={34} />
                                        <div>
                                            <span className="text-[9px] text-gray-500 font-black block uppercase tracking-tighter mb-0.5">{t.send}</span>
                                            <span className="text-sm font-black">{sendMethods[sendMethod].name}</span>
                                        </div>
                                    </div>
                                    <div className="p-2 bg-white/5 rounded-full"><Icon name="ChevronDown" size={18} className="text-gray-500" /></div>
                                </button>

                                {/* Amount Input */}
                                <div className="bg-[#0a0a0a] border border-white/10 rounded-[2.8rem] p-6 shadow-2xl relative overflow-hidden">
                                    <div className="bg-white/[0.03] p-8 rounded-[2.5rem] border border-white/5 text-center relative z-10">
                                        <span className="text-[10px] font-black text-gray-500 uppercase block mb-2 tracking-widest">
                                            {isStarsInput ? t.starsAmount : t.usdAmount}
                                        </span>
                                        <div className="relative inline-flex items-center justify-center w-full" dir="ltr">
                                            {!isStarsInput && <span className="text-4xl font-black text-blue-500/50 mr-2">$</span>}
                                            <input 
                                                type="number" 
                                                value={amountInput} 
                                                onChange={(e) => setAmountInput(e.target.value)} 
                                                placeholder="0" 
                                                className="w-full bg-transparent text-6xl font-black text-center outline-none text-white placeholder:text-white/5" 
                                            />
                                        </div>
                                        <div className="mt-4 flex flex-col items-center gap-2">
                                            <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-blue-500/10 rounded-full border border-blue-500/10">
                                                {isStarsInput ? <Icon name="Star" size={12} className="text-yellow-400" /> : <Icon name="DollarSign" size={12} className="text-blue-400" />}
                                                <span className="text-[10px] text-blue-400 font-black uppercase tracking-tighter">
                                                    {isStarsInput ? `Rate: 100 ⭐ = ${( (rates.stars || 0.01) * 100 ).toFixed(2)} USD` : "Rate: 1.00 USD = 1.00 USD"}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Receive Method */}
                                <button onClick={() => setModalOpen('receive')} className="w-full bg-[#0a0a0a] border border-white/10 p-5 rounded-[2.2rem] flex items-center justify-between hover:bg-white/[0.04] transition-all active:scale-[0.98]">
                                    <div className="flex items-center gap-4 text-right">
                                        <MethodIcon id={receiveMethod} size={34} />
                                        <div>
                                            <span className="text-[9px] text-gray-500 font-black block uppercase tracking-tighter mb-0.5">{t.receive}</span>
                                            <span className="text-sm font-black">{receiveMethods[receiveMethod].name}</span>
                                        </div>
                                    </div>
                                    <div className="p-2 bg-white/5 rounded-full"><Icon name="ChevronDown" size={18} className="text-gray-500" /></div>
                                </button>

                                {/* Calculation Summary */}
                                <div className="bg-gradient-to-br from-blue-600/10 to-transparent border border-blue-500/20 p-7 rounded-[2.8rem] space-y-5 shadow-inner">
                                    <div className="flex justify-between items-end">
                                        <div className="text-right">
                                            <span className="text-[10px] font-black text-gray-500 block uppercase tracking-widest mb-1">{t.netAmount}</span>
                                            <span className="text-3xl font-black text-blue-400" dir="ltr">{getDisplayAmount()}</span>
                                        </div>
                                        <div className="text-left bg-white/5 px-4 py-2 rounded-2xl border border-white/5">
                                            <span className="text-[9px] text-gray-600 font-black block uppercase italic">{t.afterFees}</span>
                                            <span className="text-sm font-black text-white/40" dir="ltr">-{getFeeSettings().percentage * 100}%</span>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-3 gap-2 pt-4 border-t border-white/5">
                                        <div className="text-center">
                                            <span className="text-[8px] text-gray-500 uppercase font-black block mb-1">{t.calcFee}</span>
                                            <span className="text-[11px] font-black text-red-500/70" dir="ltr">${calculateFee().toFixed(3)}</span>
                                        </div>
                                        <div className="text-center border-x border-white/5">
                                            <span className="text-[8px] text-gray-500 uppercase font-black block mb-1">{t.calcTime}</span>
                                            <span className="text-[11px] font-black text-blue-400">{t.timeValue}</span>
                                        </div>
                                        <div className="text-center">
                                            <span className="text-[8px] text-gray-500 uppercase font-black block mb-1">{t.calcRate}</span>
                                            <span className="text-[11px] font-black text-green-500/70">1:1</span>
                                        </div>
                                    </div>

                                    {['vodafone', 'asiapay', 'paysera', 'bkash', 'zaincash', 'instapay'].includes(receiveMethod) && (
                                        <div className="flex flex-col gap-2 items-center bg-blue-500/5 py-3 px-4 rounded-2xl border border-blue-500/10 text-center">
                                            <div className="flex items-center gap-2">
                                                <Icon name="Info" size={12} className="text-blue-400" />
                                                <span className="text-[9px] font-black text-blue-400 uppercase tracking-tighter">
                                                    {receiveMethod === 'instapay' ? t.fixedFeeNoteInsta : t.fixedFeeNote} | {receiveMethod === 'instapay' ? t.minAmountNoteInsta : t.minAmountNote}
                                                </span>
                                            </div>
                                            {receiveMethod === 'bkash' && <span className="text-[9px] text-gray-500 font-bold italic">Rate: 1$ = {rates.bkash || 150}৳</span>}
                                            {receiveMethod === 'instapay' && <span className="text-[9px] text-gray-500 font-bold italic">Rate: 1$ = {rates.instapay || 55} EGP</span>}
                                            {(receiveMethod === 'zaincash' || receiveMethod === 'asiapay') && <span className="text-[9px] text-gray-500 font-bold italic">Rate: 1$ = {receiveMethod === 'zaincash' ? (rates.zaincash || 1750) : (rates.asiapay || 1310)} IQD</span>}
                                        </div>
                                    )}
                                </div>

                                {/* Submission Form */}
                                <div className="bg-[#0a0a0a] border border-white/10 rounded-[3rem] p-7 space-y-7 shadow-2xl">
                                    {!sendMethods[sendMethod].isStar && (
                                        <div className="space-y-5">
                                            <div className="bg-blue-600/5 border border-blue-500/20 p-6 rounded-[2.2rem] text-center space-y-4">
                                                <span className="text-[10px] font-black text-blue-400 block uppercase tracking-widest">{t.transferData}</span>
                                                <code className="block bg-black/60 p-4 rounded-2xl text-[11px] font-mono break-all border border-white/5 text-gray-300">
                                                    {sendMethods[sendMethod].address}
                                                </code>
                                                <button onClick={() => handleCopy(sendMethods[sendMethod].address)} className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 rounded-2xl font-black text-[11px] flex items-center justify-center gap-2 transition-all">
                                                    <Icon name="Copy" size={14} /> {t.copy}
                                                </button>
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <button onClick={() => fileInputRef.current.click()} className={`p-5 rounded-3xl border transition-all flex flex-col items-center gap-2 active:scale-95 ${screenshot ? 'border-green-500 bg-green-500/5 text-green-500' : 'border-white/5 bg-white/[0.02] text-gray-500 hover:bg-white/[0.04]'}`}>
                                                    <Icon name="Camera" size={24} />
                                                    <span className="text-[10px] font-black uppercase tracking-tighter">{screenshot ? 'Added' : t.screenshot}</span>
                                                    <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={(e) => { setScreenshot(e.target.files[0]?.name); showToast("Proof added", 'success'); }} />
                                                </button>
                                                <div className={`bg-white/[0.02] border rounded-3xl p-5 flex flex-col items-center justify-center gap-2 focus-within:border-blue-500/30 ${txId.trim() ? 'border-green-500 bg-green-500/5' : 'border-white/5'}`}>
                                                    <Icon name="ShieldCheck" size={24} className={txId.trim() ? "text-green-500" : "text-gray-500"} />
                                                    <input type="text" value={txId} onChange={(e) => setTxId(e.target.value)} placeholder={t.txId} className="w-full bg-transparent text-center text-[10px] outline-none font-black text-white" />
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div className="space-y-3">
                                        <label className="text-[10px] font-black text-gray-500 uppercase flex items-center gap-2 tracking-widest mr-3">
                                            <Icon name="Smartphone" size={14} className="text-blue-500" /> {t.receivingInfo}
                                        </label>
                                        <input 
                                            type="text" 
                                            value={userReceiveInfo} 
                                            onChange={(e) => setUserReceiveInfo(e.target.value)} 
                                            placeholder={t.placeholder} 
                                            className="w-full bg-black border border-white/5 rounded-3xl py-5 px-7 outline-none text-xs font-black focus:border-blue-500/50 transition-all text-white" 
                                        />
                                    </div>

                                    <button onClick={handleProcess} disabled={loading} className="w-full py-6 rounded-[2.2rem] font-black text-xl bg-gradient-to-r from-blue-700 to-blue-500 text-white shadow-lg active:scale-95 transition-all flex justify-center items-center gap-4">
                                        {loading ? <Icon name="Loader2" className="animate-spin" size={24} /> : <><Icon name="Send" size={24} /> {t.confirm}</>}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* -------------------- TAB: HISTORY (السجل الحي) -------------------- */}
                        {currentTab === 'history' && (
                            <div className="space-y-4 animate-fade-in">
                                <h2 className="text-lg font-black text-white mb-4 flex items-center gap-2">
                                    <Icon name="History" size={20} className="text-blue-500" />
                                    {t.historyTitle}
                                </h2>
                                
                                {history.length === 0 ? (
                                    <div className="bg-[#0a0a0a] border border-white/10 p-10 rounded-[2.2rem] flex flex-col items-center justify-center text-center gap-3">
                                        <Icon name="PackageOpen" size={40} className="text-gray-600 mb-2" />
                                        <span className="text-sm font-bold text-gray-500">{t.noHistory}</span>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {history.map((item, index) => (
                                            <div key={index} className="bg-[#0a0a0a] border border-white/10 p-5 rounded-[2rem] flex flex-col gap-3 hover:bg-white/[0.02] transition-all">
                                                <div className="flex justify-between items-center border-b border-white/5 pb-3">
                                                    <span className="text-[11px] font-mono text-gray-400">{item.id}</span>
                                                    <span className="text-[10px] text-gray-500">{item.date}</span>
                                                </div>
                                                <div className="flex justify-between items-center py-2">
                                                    <div className="text-right">
                                                        <span className="text-[9px] text-gray-500 block">{t.send} / {t.receive}</span>
                                                        <span className="text-xs font-bold block mt-1">{item.send} ➔ {item.receive}</span>
                                                    </div>
                                                    <div className="text-left">
                                                        <span className="text-[9px] text-gray-500 block">{t.netAmount}</span>
                                                        <span className="text-lg font-black block text-blue-400" dir="ltr">${item.net_amount.toFixed(2)}</span>
                                                    </div>
                                                </div>
                                                <div className="pt-2 border-t border-white/5">
                                                    {item.status === 'completed' && <div className="inline-flex items-center gap-1.5 bg-green-500/10 text-green-400 px-3 py-1.5 rounded-full text-[10px] font-black border border-green-500/20"><Icon name="CheckCircle2" size={12}/> {t.statusCompleted}</div>}
                                                    {item.status === 'pending' && <div className="inline-flex items-center gap-1.5 bg-yellow-500/10 text-yellow-400 px-3 py-1.5 rounded-full text-[10px] font-black border border-yellow-500/20"><Icon name="Clock" size={12} className="animate-spin-slow" /> {t.statusPending}</div>}
                                                    {item.status === 'failed' && <div className="inline-flex items-center gap-1.5 bg-red-500/10 text-red-400 px-3 py-1.5 rounded-full text-[10px] font-black border border-red-500/20"><Icon name="XCircle" size={12}/> {t.statusFailed}</div>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* -------------------- TAB: REFERRAL (الإحالات والأصدقاء) -------------------- */}
                        {currentTab === 'referral' && (
                            <div className="space-y-4 animate-fade-in">
                                {/* بطاقة الدعوة */}
                                <div className="bg-gradient-to-br from-blue-900/40 to-[#0a0a0a] border border-blue-500/20 p-7 rounded-[2.8rem] space-y-5 shadow-2xl relative overflow-hidden">
                                    <div className="absolute -top-10 -left-10 w-32 h-32 bg-blue-500/20 blur-3xl rounded-full"></div>
                                    <div className="relative z-10 text-center space-y-3">
                                        <div className="w-16 h-16 bg-blue-500/10 border border-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                                            <Icon name="Users" size={32} className="text-blue-400" />
                                        </div>
                                        <h2 className="text-xl font-black text-white">{t.referralTitle}</h2>
                                        <p className="text-xs text-gray-400 leading-relaxed max-w-[250px] mx-auto">{t.referralDesc}</p>
                                    </div>
                                    
                                    <div className="pt-4 space-y-3">
                                        <div className="bg-black/50 border border-white/5 p-4 rounded-2xl flex items-center justify-between gap-3 overflow-hidden">
                                            <span className="text-[11px] font-mono text-gray-300 truncate block text-left w-full" dir="ltr">{referralLink}</span>
                                        </div>
                                        <button onClick={() => handleCopy(referralLink)} className="w-full py-4 bg-blue-600 hover:bg-blue-500 rounded-2xl font-black text-[12px] flex items-center justify-center gap-2 transition-all">
                                            <Icon name="Copy" size={16} /> {t.copyLink}
                                        </button>
                                    </div>
                                </div>

                                {/* قائمة الأصدقاء المدعوين الحقيقية */}
                                <div className="pt-4">
                                    <h3 className="text-sm font-black text-white mb-4 flex items-center gap-2">
                                        <Icon name="Trophy" size={16} className="text-yellow-500" />
                                        {t.myReferrals}
                                        <span className="bg-white/10 text-white text-[10px] px-2 py-0.5 rounded-full mr-auto">{referrals.length}</span>
                                    </h3>
                                    
                                    {referrals.length === 0 ? (
                                        <div className="bg-[#0a0a0a] border border-white/10 p-8 rounded-[2rem] flex flex-col items-center justify-center text-center gap-3">
                                            <span className="text-xs font-bold text-gray-500">{t.noReferrals}</span>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {referrals.map((user) => (
                                                <div key={user.id} className="bg-[#0a0a0a] border border-white/10 p-4 rounded-[1.8rem] flex items-center justify-between hover:bg-white/[0.02] transition-all">
                                                    <div className="flex items-center gap-4">
                                                        <img src={user.avatar} alt={user.name} className="w-12 h-12 rounded-full border border-white/10 object-cover" />
                                                        <div>
                                                            <span className="text-sm font-black text-white block mb-0.5">{user.name}</span>
                                                            <span className="text-[10px] text-blue-400 font-mono" dir="ltr">{user.username || 'بدون معرف'}</span>
                                                        </div>
                                                    </div>
                                                    <Icon name="CheckCircle2" size={18} className="text-green-500/50" />
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 w-full bg-[#050505]/90 backdrop-blur-xl border-t border-white/5 pb-safe z-[80]">
                        <div className="max-w-md mx-auto flex justify-around items-center px-2 py-3">
                            <button 
                                onClick={() => setCurrentTab('swap')} 
                                className={`flex flex-col items-center gap-1.5 p-2 w-1/3 transition-all ${currentTab === 'swap' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-400'}`}
                            >
                                <div className={`p-2 rounded-2xl transition-all ${currentTab === 'swap' ? 'bg-blue-500/10' : ''}`}>
                                    <Icon name="ArrowLeftRight" size={22} />
                                </div>
                                <span className="text-[9px] font-black uppercase">{t.navSwap}</span>
                            </button>
                            
                            <button 
                                onClick={() => setCurrentTab('history')} 
                                className={`flex flex-col items-center gap-1.5 p-2 w-1/3 transition-all ${currentTab === 'history' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-400'}`}
                            >
                                <div className={`p-2 rounded-2xl transition-all ${currentTab === 'history' ? 'bg-blue-500/10' : ''}`}>
                                    <Icon name="History" size={22} />
                                </div>
                                <span className="text-[9px] font-black uppercase">{t.navHistory}</span>
                            </button>
                            
                            <button 
                                onClick={() => setCurrentTab('referral')} 
                                className={`flex flex-col items-center gap-1.5 p-2 w-1/3 transition-all ${currentTab === 'referral' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-400'}`}
                            >
                                <div className={`p-2 rounded-2xl transition-all ${currentTab === 'referral' ? 'bg-blue-500/10' : ''}`}>
                                    <Icon name="Users" size={22} />
                                </div>
                                <span className="text-[9px] font-black uppercase">{t.navReferral}</span>
                            </button>
                        </div>
                    </nav>

                    {/* Modal */}
                    {modalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end justify-center p-4">
                            <div className="absolute inset-0 bg-black/90 backdrop-blur-md animate-fade-in" onClick={() => setModalOpen(null)}></div>
                            <div className="relative bg-[#0d0d0d] border border-white/10 w-full max-w-sm rounded-[3rem] p-8 shadow-2xl animate-slide-in-up">
                                <div className="w-12 h-1.5 bg-white/10 rounded-full mx-auto mb-8"></div>
                                <div className="flex justify-between items-center mb-8 px-2">
                                    <h2 className="text-xs font-black text-gray-500 uppercase tracking-widest">{modalOpen === 'send' ? t.send : t.receive}</h2>
                                    <button onClick={() => setModalOpen(null)} className="p-2.5 bg-white/5 rounded-full"><Icon name="X" size={20} /></button>
                                </div>
                                <div className="grid grid-cols-2 gap-4 pb-4 max-h-[55vh] overflow-y-auto no-scrollbar">
                                    {Object.keys(modalOpen === 'send' ? sendMethods : receiveMethods).map(key => (
                                        <button 
                                            key={key} 
                                            onClick={() => { if(modalOpen === 'send') setSendMethod(key); else setReceiveMethod(key); setModalOpen(null); }} 
                                            className={`flex flex-col items-center gap-4 p-8 rounded-[2.5rem] border transition-all ${ (modalOpen === 'send' ? sendMethod : receiveMethod) === key ? 'border-blue-600 bg-blue-600/10' : 'border-white/5 bg-white/[0.03] hover:bg-white/[0.06]'}`}
                                        >
                                            <MethodIcon id={key} size={38} />
                                            <span className="text-[10px] font-black uppercase text-center leading-tight">{(modalOpen === 'send' ? sendMethods[key] : receiveMethods[key]).name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
