<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bimo Swap - بيمو سواب</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #020202; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Firebase Config من بياناتك ---
        const firebaseConfig = {
            apiKey: "", // تترك فارغة ليتم ملؤها تلقائياً أو وضع مفتاحك هنا
            authDomain: "bimo-swap.firebaseapp.com",
            projectId: "bimo-swap",
            storageBucket: "bimo-swap.firebasestorage.app",
            messagingSenderId: "364296788582",
            appId: "1:364296788582:web:178e845564468f9b9f52f3"
        };

        // Initialize Firebase (Imports dynamically)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, addDoc, serverTimestamp, onSnapshot, query, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appIdStr = "bimo-swap";

        const translations = {
            ar: {
                status: "الحالة: متوفر وسريع دائماً",
                title: "بيمو سواب",
                send: "أرسل عبر",
                receive: "استلم عبر",
                starsAmount: "عدد النجوم",
                usdAmount: "المبلغ بالدولار ($)",
                netAmount: "المبلغ الصافي لك",
                transferData: "بيانات التحويل",
                copy: "نسخ العنوان",
                copied: "تم النسخ!",
                confirm: "تأكيد الإرسال",
                exchange: "التبادل",
                referral: "الإحالة",
                placeholder: "رقم الحساب أو المحفظة...",
                errorWallet: "يرجى إدخال عنوان الاستلام",
                successMsg: "تم استلام طلبك بنجاح! جاري المعالجة...",
                refTitle: "برنامج الشركاء",
                refDesc: "شارك الرابط واحصل على 5% من كل عملية تبادل",
                timeValue: "5 - 30 دقيقة",
                adminTitle: "لوحة التحكم"
            },
            en: {
                status: "Status: Online & Fast",
                title: "Bimo Swap",
                send: "Send Via",
                receive: "Receive Via",
                starsAmount: "Stars",
                usdAmount: "Amount ($)",
                netAmount: "Net for You",
                transferData: "Transfer Details",
                copy: "Copy",
                copied: "Copied!",
                confirm: "Confirm",
                exchange: "Exchange",
                referral: "Referral",
                placeholder: "Account/Wallet info...",
                errorWallet: "Enter receiving info",
                successMsg: "Order received!",
                refTitle: "Partner Program",
                refDesc: "Earn 5% from exchanges",
                timeValue: "5-30 mins",
                adminTitle: "Admin Panel"
            }
        };

        const MethodIcon = ({ id, size = 28 }) => {
            const imgStyle = `width: ${size}px; height: ${size}px; border-radius: 8px; object-fit: cover;`;
            if (id === 'stars') return <i data-lucide="star" class="text-yellow-400 fill-yellow-400" style={{width: size, height: size}}></i>;
            if (id === 'usdt_ton') return <div className="flex items-center justify-center bg-[#26A17B] rounded-full text-white font-bold" style={{width: size, height: size}}>$</div>;
            if (id === 'vodafone') return <img src="https://up6.cc/2026/05/177818331530571.jpeg" style={{width: size, height: size, borderRadius: '8px'}} />;
            if (id === 'instapay') return <img src="https://up6.cc/2026/05/17782470391531.png" style={{width: size, height: size, borderRadius: '8px'}} />;
            if (id === 'binance') return <img src="https://up6.cc/2026/05/177817190244111.jpg" style={{width: size, height: size, borderRadius: '8px'}} />;
            return <i data-lucide="wallet" style={{width: size, height: size}}></i>;
        };

        function App() {
            const [lang, setLang] = useState('ar');
            const [page, setPage] = useState('exchange');
            const [amountInput, setAmountInput] = useState('');
            const [sendMethod, setSendMethod] = useState('stars');
            const [receiveMethod, setReceiveMethod] = useState('usdt_ton');
            const [userReceiveInfo, setUserReceiveInfo] = useState('');
            const [loading, setLoading] = useState(false);
            const [modalOpen, setModalOpen] = useState(null);
            const [toast, setToast] = useState({ show: false, msg: '', type: 'error' });
            const [user, setUser] = useState(null);
            const [orders, setOrders] = useState([]);

            const tg = window.Telegram?.WebApp;
            const currentUID = tg?.initDataUnsafe?.user?.id?.toString() || "GUEST_" + Math.floor(Math.random()*1000);
            const IS_ADMIN = currentUID === "7416599626";

            const t = translations[lang];

            useEffect(() => {
                const unsub = onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        setUser(u);
                        const userRef = doc(db, 'artifacts', appIdStr, 'users', u.uid, 'profile', 'data');
                        await setDoc(userRef, { uid: currentUID, lastSeen: serverTimestamp() }, { merge: true });
                    } else {
                        signInAnonymously(auth);
                    }
                });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (user && IS_ADMIN) {
                    const ordersRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'orders');
                    const q = query(ordersRef, limit(20));
                    return onSnapshot(q, (snap) => {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setOrders(data.sort((a,b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0)));
                    });
                }
            }, [user, IS_ADMIN]);

            useEffect(() => { lucide.createIcons(); }, [page, modalOpen]);

            const sendMethods = {
                stars: { name: "Telegram Stars", isStar: true },
                usdt_ton: { name: "USDT (TON)", address: "EQC-YOUR-TON-ADDRESS" },
                binance: { name: "Binance Pay", address: "Pay ID: 558900122" }
            };

            const receiveMethods = {
                usdt_ton: { name: "USDT (TON)" },
                vodafone: { name: "Vodafone Cash" },
                instapay: { name: "InstaPay" }
            };

            const calculateGross = () => (parseFloat(amountInput) || 0) * (sendMethod === 'stars' ? 0.01 : 1);
            const netUSD = calculateGross() * 0.85; // مثال: رسوم 15%

            const handleProcess = async () => {
                if (!amountInput || !userReceiveInfo) {
                    setToast({ show: true, msg: t.errorWallet, type: 'error' });
                    setTimeout(() => setToast({show:false}), 3000);
                    return;
                }
                setLoading(true);
                try {
                    const ordersRef = collection(db, 'artifacts', appIdStr, 'public', 'data', 'orders');
                    await addDoc(ordersRef, {
                        uid: currentUID,
                        sendMethod,
                        receiveMethod,
                        amountSent: amountInput,
                        amountNet: netUSD.toFixed(2),
                        wallet: userReceiveInfo,
                        timestamp: serverTimestamp(),
                        status: 'pending'
                    });
                    setToast({ show: true, msg: t.successMsg, type: 'success' });
                    setAmountInput('');
                    setUserReceiveInfo('');
                } catch (e) {
                    setToast({ show: true, msg: "Cloud Error", type: 'error' });
                } finally {
                    setLoading(false);
                    setTimeout(() => setToast({show:false}), 3000);
                }
            };

            return (
                <div className="min-h-screen pb-32 overflow-x-hidden" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    {toast.show && (
                        <div className="fixed top-10 left-1/2 -translate-x-1/2 z-[200] w-[90%] max-w-xs p-4 rounded-2xl glass border-white/20 text-center shadow-2xl animate-bounce">
                            <span className={toast.type === 'success' ? 'text-green-400' : 'text-red-400'}>{toast.msg}</span>
                        </div>
                    )}

                    <header className="p-6 flex justify-between items-center glass sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <img src="https://up6.cc/2026/05/177817395989891.jpg" className="w-10 h-10 rounded-xl" />
                            <h1 className="text-xl font-black">{t.title}</h1>
                        </div>
                        <div className="flex gap-2">
                            {IS_ADMIN && <button onClick={() => setPage('admin')} className="p-2 bg-red-500/10 rounded-lg"><i data-lucide="settings" class="w-5 h-5"></i></button>}
                            <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="bg-white/10 px-4 py-1 rounded-lg text-xs font-bold">{lang.toUpperCase()}</button>
                        </div>
                    </header>

                    {page === 'exchange' && (
                        <main className="p-5 space-y-6 max-w-md mx-auto animate-in fade-in duration-500">
                            <div className="bg-[#0a0a0a] border border-white/10 rounded-[2.5rem] p-6 space-y-4 shadow-2xl">
                                <button onClick={() => setModalOpen('send')} className="w-full flex justify-between items-center bg-white/5 p-4 rounded-2xl">
                                    <div className="flex items-center gap-3">
                                        <MethodIcon id={sendMethod} />
                                        <span className="text-sm font-bold">{sendMethods[sendMethod].name}</span>
                                    </div>
                                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                </button>

                                <div className="bg-black/40 p-8 rounded-3xl text-center border border-white/5">
                                    <input type="number" value={amountInput} onChange={(e) => setAmountInput(e.target.value)} placeholder="0.00" className="bg-transparent text-5xl font-black text-center w-full outline-none text-blue-500" />
                                    <span className="text-[10px] text-gray-500 font-bold block mt-3">{sendMethod === 'stars' ? t.starsAmount : t.usdAmount}</span>
                                </div>

                                <button onClick={() => setModalOpen('receive')} className="w-full flex justify-between items-center bg-white/5 p-4 rounded-2xl">
                                    <div className="flex items-center gap-3">
                                        <MethodIcon id={receiveMethod} />
                                        <span className="text-sm font-bold">{receiveMethods[receiveMethod].name}</span>
                                    </div>
                                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                </button>
                            </div>

                            <div className="bg-blue-600/10 border border-blue-500/20 p-6 rounded-[2.5rem] flex justify-between items-center">
                                <div>
                                    <span className="text-[10px] font-black text-blue-400 block mb-1 uppercase tracking-widest">{t.netAmount}</span>
                                    <span className="text-3xl font-black text-white">${netUSD.toFixed(2)}</span>
                                </div>
                                <div className="text-right">
                                    <span className="text-[10px] text-gray-500 block uppercase">الوقت</span>
                                    <span className="text-xs font-bold text-gray-300">{t.timeValue}</span>
                                </div>
                            </div>

                            <div className="bg-[#0a0a0a] border border-white/10 rounded-[2.5rem] p-6 space-y-4">
                                {!sendMethods[sendMethod].isStar && (
                                    <div className="bg-black p-4 rounded-2xl border border-white/5 flex justify-between items-center">
                                        <code className="text-[10px] text-blue-300 truncate w-2/3">{sendMethods[sendMethod].address}</code>
                                        <button onClick={() => { navigator.clipboard.writeText(sendMethods[sendMethod].address); alert(t.copied); }} className="p-2 bg-blue-600 rounded-lg"><i data-lucide="copy" class="w-4 h-4"></i></button>
                                    </div>
                                )}
                                <input type="text" value={userReceiveInfo} onChange={(e) => setUserReceiveInfo(e.target.value)} placeholder={t.placeholder} className="w-full bg-black border border-white/5 p-5 rounded-2xl outline-none text-sm font-bold focus:border-blue-500" />
                                <button onClick={handleProcess} disabled={loading} className="w-full bg-blue-600 py-5 rounded-2xl font-black text-lg active:scale-95 transition-all">
                                    {loading ? "..." : t.confirm}
                                </button>
                            </div>
                        </main>
                    )}

                    {page === 'referral' && (
                        <main className="p-8 text-center space-y-6">
                            <div className="w-20 h-20 bg-blue-600/20 rounded-3xl flex items-center justify-center mx-auto"><i data-lucide="users" class="w-10 h-10 text-blue-500"></i></div>
                            <h2 className="text-2xl font-black">{t.refTitle}</h2>
                            <p className="text-gray-500 text-sm">{t.refDesc}</p>
                            <div className="bg-white/5 p-6 rounded-3xl border border-white/10 flex justify-between items-center">
                                <span className="text-xs font-mono opacity-50">t.me/BimoSwapBot?start={currentUID}</span>
                                <i data-lucide="share-2" class="w-5 h-5 text-blue-500"></i>
                            </div>
                        </main>
                    )}

                    {page === 'admin' && IS_ADMIN && (
                        <main className="p-5 space-y-4">
                            <h2 className="text-red-500 font-black px-2">{t.adminTitle}</h2>
                            {orders.map(o => (
                                <div key={o.id} className="bg-[#0a0a0a] p-5 rounded-2xl border border-white/10">
                                    <div className="flex justify-between mb-2">
                                        <span className="text-xs font-bold text-blue-400">{o.uid}</span>
                                        <span className="text-[10px] bg-yellow-500/10 text-yellow-500 px-2 rounded-full uppercase">{o.status}</span>
                                    </div>
                                    <div className="text-sm font-black">{o.amountSent} → {o.amountNet}$ ({o.receiveMethod})</div>
                                    <div className="text-[10px] text-gray-500 mt-2 bg-black p-2 rounded">{o.wallet}</div>
                                </div>
                            ))}
                        </main>
                    )}

                    <nav className="fixed bottom-6 left-6 right-6 z-50 flex justify-center">
                        <div className="bg-black/80 backdrop-blur-3xl border border-white/10 h-16 rounded-full flex items-center px-12 gap-16 shadow-2xl">
                            <button onClick={() => setPage('exchange')} className={page === 'exchange' ? 'text-blue-500' : 'text-gray-500'}><i data-lucide="layout-grid" class="w-6 h-6"></i></button>
                            <button onClick={() => setPage('referral')} className={page === 'referral' ? 'text-blue-500' : 'text-gray-500'}><i data-lucide="users" class="w-6 h-6"></i></button>
                        </div>
                    </nav>

                    {modalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-end justify-center p-4">
                            <div className="absolute inset-0 bg-black/90 backdrop-blur-sm" onClick={() => setModalOpen(null)}></div>
                            <div className="relative bg-[#0d0d0d] w-full max-w-sm rounded-[3rem] p-8 border border-white/10 animate-in slide-in-from-bottom-10">
                                <div className="grid grid-cols-2 gap-4">
                                    {Object.keys(modalOpen === 'send' ? sendMethods : receiveMethods).map(k => (
                                        <button key={k} onClick={() => { if(modalOpen==='send') setSendMethod(k); else setReceiveMethod(k); setModalOpen(null); }} className="p-6 bg-white/5 rounded-3xl flex flex-col items-center gap-3 border border-white/5 hover:bg-blue-600/10 transition-all">
                                            <MethodIcon id={k} size={32} />
                                            <span className="text-[10px] font-black uppercase tracking-tighter">{(modalOpen === 'send' ? sendMethods[k] : receiveMethods[k]).name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
