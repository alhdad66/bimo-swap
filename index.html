<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bimo Swap - Cloud System</title>
    
    <!-- Scripts: تحميل مباشر لضمان العمل في كل البيئات -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #020202; color: white; margin: 0; padding: 0; overflow-x: hidden; }
        .glass { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .neo-card { background: linear-gradient(145deg, #0a0a0a, #111); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .btn-blue { background: linear-gradient(90deg, #1d4ed8, #3b82f6); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-blue:active { transform: scale(0.96); opacity: 0.9; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKNuDGka3t1Lm8X_FaP",
            authDomain: "bimo-swap.firebaseapp.com",
            projectId: "bimo-swap",
            storageBucket: "bimo-swap.firebasestorage.app",
            messagingSenderId: "364296788582",
            appId: "1:364296788582:web:178e845564468f9b9f52f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // تصدير للـ Window ليستخدمه React
        window.fb = { db, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot };
    </script>

    <!-- React App Logic -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // أيقونات مخصصة لضمان الظهور
        const MethodIcon = ({ id, size = 32 }) => {
            const icons = {
                stars: <i className="fas fa-star text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.5)]"></i>,
                usdt_ton: <div className="relative"><i className="fas fa-dollar-sign text-green-500"></i><span className="absolute -bottom-2 -right-2 text-[8px] bg-blue-600 px-1 rounded">TON</span></div>,
                instapay: <img src="https://up6.cc/2026/05/17782470391531.png" className="rounded-lg object-cover" style={{width:size, height:size}} />,
                vodafone: <img src="https://up6.cc/2026/05/177818331530571.jpeg" className="rounded-lg object-cover" style={{width:size, height:size}} />,
                binance: <img src="https://up6.cc/2026/05/177817190244111.jpg" className="rounded-lg object-cover" style={{width:size, height:size}} />,
                asiapay: <img src="https://up6.cc/2026/05/17781834516841.jpeg" className="rounded-lg object-cover" style={{width:size, height:size}} />,
                zaincash: <img src="https://up6.cc/2026/05/17782464670791.png" className="rounded-lg object-cover" style={{width:size, height:size}} />,
                bkash: <img src="https://up6.cc/2026/05/177824587778081.jpeg" className="rounded-lg object-cover" style={{width:size, height:size}} />,
                ton: <img src="https://up6.cc/2026/05/177817200499771.jpg" className="rounded-lg object-cover" style={{width:size, height:size}} />
            };
            return <div style={{fontSize: size*0.8}} className="flex items-center justify-center">{icons[id] || <i className="fas fa-wallet text-gray-400"></i>}</div>;
        };

        const SEND_METHODS = {
            stars: { name: "Telegram Stars", rate: 0.01, isStar: true },
            binance: { name: "Binance Pay", rate: 1, address: "Pay ID: 558900122" },
            usdt_ton: { name: "USDT (TON)", rate: 1, address: "EQC-YOUR-REAL-WALLET-HERE" }
        };

        const RECEIVE_METHODS = {
            instapay: { name: "InstaPay", rate: 55, currency: "EGP", min: 2 },
            vodafone: { name: "Vodafone Cash", rate: 50, currency: "EGP", min: 5 },
            usdt_ton: { name: "USDT (TON)", rate: 1, currency: "USD", min: 1 },
            asiapay: { name: "AsiaPay", rate: 1310, currency: "IQD", min: 5 },
            zaincash: { name: "Zain Cash", rate: 1750, currency: "IQD", min: 5 }
        };

        function App() {
            const [page, setPage] = useState('exchange');
            const [amount, setAmount] = useState('');
            const [sendMethod, setSendMethod] = useState('stars');
            const [receiveMethod, setReceiveMethod] = useState('instapay');
            const [wallet, setWallet] = useState('');
            const [txId, setTxId] = useState('');
            const [modal, setModal] = useState(null);
            const [loading, setLoading] = useState(false);
            const [orders, setOrders] = useState([]);

            const ADMIN_ID = "7416599626"; // آيدي الآدمن الخاص بك

            const results = useMemo(() => {
                const val = parseFloat(amount) || 0;
                const usdGross = sendMethod === 'stars' ? val * 0.01 : val;
                const fee = (receiveMethod === 'instapay') ? (usdGross * 0.03 + 0.2) : (usdGross * 0.03 + 0.5);
                const netUsd = Math.max(0, usdGross - fee);
                const final = netUsd * RECEIVE_METHODS[receiveMethod].rate;
                return { netUsd, final };
            }, [amount, sendMethod, receiveMethod]);

            useEffect(() => {
                if (page === 'admin' && window.fb) {
                    const q = window.fb.query(window.fb.collection(window.fb.db, "orders"), window.fb.orderBy("createdAt", "desc"));
                    return window.fb.onSnapshot(q, (s) => setOrders(s.docs.map(d => ({id: d.id, ...d.data()}))));
                }
            }, [page]);

            const handleSubmit = async () => {
                if (!amount || !wallet) return alert("يرجى إكمال البيانات!");
                if (results.netUsd < RECEIVE_METHODS[receiveMethod].min) return alert(`أقل مبلغ صافي هو ${RECEIVE_METHODS[receiveMethod].min}$`);
                
                setLoading(true);
                try {
                    await window.fb.addDoc(window.fb.collection(window.fb.db, "orders"), {
                        amount,
                        sendVia: SEND_METHODS[sendMethod].name,
                        receiveVia: RECEIVE_METHODS[receiveMethod].name,
                        netAmount: results.final.toFixed(2),
                        currency: RECEIVE_METHODS[receiveMethod].currency,
                        wallet,
                        txId: txId || "Stars Payment",
                        createdAt: window.fb.serverTimestamp(),
                        status: 'pending'
                    });
                    alert("تم إرسال طلبك بنجاح!");
                    setAmount(''); setWallet(''); setTxId('');
                } catch (e) { alert("فشل في السحابة!"); }
                setLoading(false);
            };

            return (
                <div className="min-h-screen pb-32">
                    {/* Header */}
                    <header className="p-5 glass sticky top-0 z-50 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <img src="https://up6.cc/2026/05/177817395989891.jpg" className="w-10 h-10 rounded-xl border border-white/20" />
                            <div>
                                <h1 className="text-lg font-black leading-none">بيمو سواب</h1>
                                <span className="text-[8px] text-blue-500 uppercase font-black tracking-widest tracking-[0.2em]">Cloud Admin</span>
                            </div>
                        </div>
                        <button onClick={() => setPage(page === 'admin' ? 'exchange' : 'admin')} className="text-red-500 bg-red-500/10 px-3 py-1 rounded-lg text-[10px] font-bold">
                           <i className="fas fa-cog"></i>
                        </button>
                    </header>

                    {page === 'exchange' ? (
                        <main className="p-5 max-w-md mx-auto space-y-6 animate-fade">
                            {/* Status */}
                            <div className="bg-blue-600/10 border border-blue-600/20 py-2 rounded-full text-center text-[10px] font-bold text-blue-400">
                                <i className="fas fa-circle text-[6px] animate-pulse ml-2"></i> الحالة: متصل وسريع
                            </div>

                            {/* Select Send */}
                            <div className="space-y-3">
                                <label className="text-[10px] text-gray-500 font-black mr-2 uppercase">أرسل عبر</label>
                                <button onClick={() => setModal('send')} className="w-full neo-card p-5 rounded-[2rem] flex justify-between items-center">
                                    <div className="flex items-center gap-4">
                                        <MethodIcon id={sendMethod} />
                                        <span className="font-bold">{SEND_METHODS[sendMethod].name}</span>
                                    </div>
                                    <i className="fas fa-chevron-down text-gray-600"></i>
                                </button>
                            </div>

                            {/* Amount Input */}
                            <div className="neo-card p-8 rounded-[2.8rem] text-center">
                                <span className="text-[10px] text-gray-500 font-black block mb-2 uppercase">المبلغ</span>
                                <input type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0" className="w-full bg-transparent text-5xl font-black text-center outline-none text-white placeholder:text-white/5" />
                            </div>

                            {/* Select Receive */}
                            <div className="space-y-3">
                                <label className="text-[10px] text-gray-500 font-black mr-2 uppercase">استلم عبر</label>
                                <button onClick={() => setModal('receive')} className="w-full neo-card p-5 rounded-[2rem] flex justify-between items-center">
                                    <div className="flex items-center gap-4">
                                        <MethodIcon id={receiveMethod} />
                                        <span className="font-bold">{RECEIVE_METHODS[receiveMethod].name}</span>
                                    </div>
                                    <i className="fas fa-chevron-down text-gray-600"></i>
                                </button>
                            </div>

                            {/* Result Display */}
                            <div className="bg-gradient-to-br from-blue-900/20 to-black border border-blue-500/20 p-8 rounded-[2.8rem] flex justify-between items-end">
                                <div>
                                    <span className="text-[10px] text-blue-400 font-black block mb-1 uppercase italic">صافي الاستلام</span>
                                    <span className="text-4xl font-black text-blue-400">{results.final.toFixed(2)}</span>
                                </div>
                                <span className="text-xs font-black text-gray-500">{RECEIVE_METHODS[receiveMethod].currency}</span>
                            </div>

                            {/* Transfer Info */}
                            <div className="neo-card p-6 rounded-[2.5rem] space-y-5">
                                {sendMethod !== 'stars' && (
                                    <div className="bg-blue-600/5 p-4 rounded-2xl border border-blue-500/10 text-center space-y-3">
                                        <span className="text-[10px] font-black text-blue-400 block tracking-widest uppercase">بيانات التحويل</span>
                                        <code className="block text-[10px] text-gray-400 break-all bg-black/50 p-3 rounded-lg border border-white/5">{SEND_METHODS[sendMethod].address}</code>
                                        <input type="text" value={txId} onChange={e => setTxId(e.target.value)} placeholder="رقم العملية (ID)" className="w-full bg-black/40 p-3 rounded-xl text-center text-xs outline-none border border-white/5" />
                                    </div>
                                )}
                                
                                <input type="text" value={wallet} onChange={e => setWallet(e.target.value)} placeholder="رقم الحساب أو المحفظة للاستلام..." className="w-full bg-black border border-white/5 rounded-2xl py-4 px-6 text-center text-xs font-bold outline-none focus:border-blue-500" />
                                
                                <button onClick={handleSubmit} disabled={loading} className="w-full py-5 btn-blue rounded-2xl font-black text-xl shadow-xl shadow-blue-600/20">
                                    {loading ? <i className="fas fa-spinner fa-spin"></i> : "تأكيد الطلب"}
                                </button>
                            </div>
                        </main>
                    ) : (
                        <main className="p-5 max-w-md mx-auto space-y-4 animate-fade">
                            <h2 className="text-xl font-black text-red-500 mb-6 italic"><i className="fas fa-cloud ml-2"></i>طلبات السحابة ({orders.length})</h2>
                            {orders.map(o => (
                                <div key={o.id} className="neo-card p-5 rounded-2xl border-r-4 border-r-blue-500">
                                    <div className="flex justify-between font-black text-sm mb-2">
                                        <span>{o.amount} {o.sendVia}</span>
                                        <span className="text-blue-400">{o.netAmount} {o.currency}</span>
                                    </div>
                                    <div className="text-[10px] text-gray-500 font-mono break-all italic opacity-60">
                                        الحساب: {o.wallet}<br/>
                                        ID: {o.txId}
                                    </div>
                                </div>
                            ))}
                        </main>
                    )}

                    {/* Navbar */}
                    <nav className="fixed bottom-8 left-6 right-6 z-50">
                        <div className="max-w-xs mx-auto glass h-20 rounded-[2.5rem] flex justify-around items-center px-6 shadow-2xl border border-white/5">
                            <button onClick={() => setPage('exchange')} className={`flex flex-col items-center gap-1 ${page === 'exchange' ? 'text-blue-500' : 'text-gray-600'}`}>
                                <i className="fas fa-sync-alt text-xl"></i>
                                <span className="text-[8px] font-black uppercase">التبادل</span>
                            </button>
                            <button onClick={() => setPage('admin')} className={`flex flex-col items-center gap-1 ${page === 'admin' ? 'text-blue-500' : 'text-gray-600'}`}>
                                <i className="fas fa-database text-xl"></i>
                                <span className="text-[8px] font-black uppercase">الطلبات</span>
                            </button>
                        </div>
                    </nav>

                    {/* Modals */}
                    {modal && (
                        <div className="fixed inset-0 z-[100] flex items-end justify-center p-4">
                            <div className="absolute inset-0 bg-black/90 backdrop-blur-md" onClick={() => setModal(null)}></div>
                            <div className="relative bg-[#0d0d0d] border border-white/10 w-full max-w-sm rounded-[3rem] p-8 shadow-2xl animate-fade">
                                <div className="w-12 h-1 bg-white/10 rounded-full mx-auto mb-8"></div>
                                <div className="grid grid-cols-2 gap-4 pb-4">
                                    {Object.entries(modal === 'send' ? SEND_METHODS : RECEIVE_METHODS).map(([id, m]) => (
                                        <button key={id} onClick={() => { modal === 'send' ? setSendMethod(id) : setReceiveMethod(id); setModal(null); }} className="flex flex-col items-center gap-3 p-6 rounded-[2rem] bg-white/[0.03] border border-white/5">
                                            <MethodIcon id={id} />
                                            <span className="text-[10px] font-black uppercase text-center leading-tight">{m.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
