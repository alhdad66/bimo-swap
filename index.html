<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bimo Swap - تبديل العملات</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // استيراد أدوات Firebase من الـ CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // بياناتك من الصور التي أرسلتها
        const firebaseConfig = {
            apiKey: "AIzaSyBKNuDGka3t1Lm8X_FaP",
            authDomain: "bimo-swap.firebaseapp.com",
            projectId: "bimo-swap",
            storageBucket: "bimo-swap.firebasestorage.app",
            messagingSenderId: "364296788582",
            appId: "1:364296788582:web:178e845564468f9b9f52f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function BimoSwap() {
            const [amount, setAmount] = React.useState('');
            const [status, setStatus] = React.useState('');

            const handleSwap = async () => {
                if(!amount) return alert("أدخل المبلغ أولاً");
                setStatus('جاري إرسال الطلب...');
                try {
                    await addDoc(collection(db, "orders"), {
                        amount: amount,
                        timestamp: serverTimestamp(),
                        status: "pending"
                    });
                    setStatus('تم استلام طلبك بنجاح! سيتم التواصل معك.');
                } catch (e) {
                    setStatus('خطأ: تأكد من تفعيل Test Mode في Firebase');
                }
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-4">
                    <div className="glass p-8 rounded-3xl w-full max-w-md text-center">
                        <img src="https://h.top4top.io/p_3052p8z2w1.png" className="w-32 mx-auto mb-4" alt="Bimo Logo" />
                        <h1 className="text-2xl font-bold mb-6">بيمو سواب - Bimo Swap</h1>
                        
                        <input 
                            type="number" 
                            placeholder="أدخل المبلغ (USDT)" 
                            className="w-full p-4 rounded-xl bg-slate-800 border-none mb-4 text-center text-xl"
                            value={amount}
                            onChange={(e) => setAmount(e.target.value)}
                        />

                        <button 
                            onClick={handleSwap}
                            className="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold transition-all"
                        >
                            تبديل الآن
                        </button>

                        {status && <p className="mt-4 text-sm text-blue-400">{status}</p>}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BimoSwap />);
    </script>
</body>
</html>
