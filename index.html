<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bimo Swap Pro</title>
    
    <!-- Scripts -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #050505; color: white; margin: 0; padding: 0; overflow-x: hidden; }
        .glass { background: rgba(15, 15, 15, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .neo-card { background: #0c0c0c; border: 1px solid rgba(255,255,255,0.05); border-radius: 2rem; }
        .btn-star { background: linear-gradient(90deg, #ff9800, #ffc107); color: black; font-weight: 900; }
        .btn-blue { background: linear-gradient(90deg, #0088cc, #00aaff); color: white; font-weight: 900; }
        .referral-box { background: linear-gradient(45deg, #1a1a1a, #0a0a0a); border: 1px dashed #333; }
        .animate-slide { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKNuDGka3t1Lm8X_FaP",
            authDomain: "bimo-swap.firebaseapp.com",
            projectId: "bimo-swap",
            storageBucket: "bimo-swap.firebasestorage.app",
            messagingSenderId: "364296788582",
            appId: "1:364296788582:web:178e845564468f9b9f52f3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.fb = { db, collection, addDoc, serverTimestamp, query, orderBy, onSnapshot, where, getDocs };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const tg = window.Telegram.WebApp;

        const ADMIN_ID = 7416599626; // الآيدي الخاص بك

        const SEND_METHODS = {
            stars: { name: "Telegram Stars", rate: 0.01, icon: "fa-star text-yellow-400" },
            usdt: { name: "USDT (TON)", rate: 1, icon: "fa-dollar-sign text-green-500", address: "EQC-YOUR-WALLET" }
        };

        const RECEIVE_METHODS = {
            instapay: { name: "InstaPay", rate: 55, currency: "EGP", min: 2 },
            vodafone: { name: "Vodafone Cash", rate: 50, currency: "EGP", min: 5 },
            usdt: { name: "USDT (TON)", rate: 1, currency: "USD", min: 1 }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [page, setPage] = useState('exchange');
            const [amount, setAmount] = useState('');
            const [sendVia, setSendVia] = useState('stars');
            const [receiveVia, setReceiveVia] = useState('instapay');
            const [wallet, setWallet] = useState('');
            const [modal, setModal] = useState(null);
            const [orders, setOrders] = useState([]);
            const [refCount, setRefCount] = useState(0);

            useEffect(() => {
                tg.ready();
                tg.expand();
                const userData = tg.initDataUnsafe?.user || { id: 0, first_name: "User" };
                setUser(userData);
                
                // جلب عدد الإحالات
                if (window.fb) {
                    const q = window.fb.query(window.fb.collection(window.fb.db, "users"), window.fb.where("referredBy", "==", userData.id.toString()));
                    window.fb.getDocs(q).then(snap => setRefCount(snap.size));
                }
            }, []);

            const results = useMemo(() => {
                const val = parseFloat(amount) || 0;
                const usdGross = sendVia === 'stars' ? val * 0.01 : val;
                const fee = usdGross * 0.05; // 5% عمولة
                const final = Math.max(0, (usdGross - fee) * RECEIVE_METHODS[receiveVia].rate);
                return { final, usdGross };
            }, [amount, sendVia, receiveVia]);

            const handleSwap = async () => {
                if (!amount || !wallet) return tg.showAlert("يرجى ملء كافة الحقول");
                
                if (sendVia === 'stars') {
                    // فتح فاتورة النجوم الحقيقية
                    // ملاحظة: يجب أن يكون البوت يدعم الـ Invoice عبر API
                    // هنا نقوم بمحاكاة الطلب وإرسال البيانات للـ Firebase لتعالجها أنت
                    tg.showConfirm(`أنت على وشك دفع ${amount} نجمة، هل تريد المتابعة؟`, async (ok) => {
                        if (ok) {
                            await submitOrder("Stars Pending");
                            tg.showAlert("تم تسجيل الطلب! قم بدفع النجوم للبوت الآن ليتم التأكيد.");
                        }
                    });
                } else {
                    await submitOrder("Manual Transfer");
                    tg.showAlert("تم إرسال الطلب بنجاح");
                }
            };

            const submitOrder = async (tx) => {
                await window.fb.addDoc(window.fb.collection(window.fb.db, "orders"), {
                    userId: user.id,
                    userName: user.first_name,
                    amount,
                    sendVia: SEND_METHODS[sendVia].name,
                    receiveVia: RECEIVE_METHODS[receiveVia].name,
                    wallet,
                    status: 'pending',
                    createdAt: window.fb.serverTimestamp()
                });
            };

            const copyRef = () => {
                const link = `https://t.me/YOUR_BOT_USERNAME?start=${user.id}`;
                navigator.clipboard.writeText(link);
                tg.showAlert("تم نسخ رابط الإحالة الخاص بك");
            };

            return (
                <div className="animate-slide">
                    {/* Top Bar */}
                    <header className="p-4 flex justify-between items-center glass sticky top-0 z-40">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs uppercase">
                                {user?.first_name[0]}
                            </div>
                            <span className="text-xs font-bold">{user?.first_name}</span>
                        </div>
                        {user?.id === ADMIN_ID ? (
                            <button onClick={() => setPage('admin')} className="bg-red-500/20 text-red-500 text-[10px] px-3 py-1 rounded-full font-bold">
                                <i className="fas fa-tools ml-1"></i> لوحة التحكم
                            </button>
                        ) : (
                            <button className="bg-white/5 text-[10px] px-3 py-1 rounded-full font-bold border border-white/5">
                                <i className="fas fa-headset ml-1 text-blue-400"></i> الدعم
                            </button>
                        )}
                    </header>

                    {page === 'exchange' ? (
                        <div className="p-5 space-y-6">
                            {/* Promo Card */}
                            <div className="neo-card p-6 bg-gradient-to-br from-blue-600/20 to-transparent border-blue-500/20">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h2 className="text-xl font-black mb-1">Bimo Swap</h2>
                                        <p className="text-[10px] text-gray-400">نظام تبادل النجوم السحابي الأول</p>
                                    </div>
                                    <img src="https://up6.cc/2026/05/177817395989891.jpg" className="w-12 h-12 rounded-xl" />
                                </div>
                            </div>

                            {/* Inputs */}
                            <div className="space-y-4">
                                <div className="neo-card p-5 space-y-4">
                                    <div className="flex justify-between text-[10px] font-bold text-gray-500 uppercase">
                                        <span>تدفع</span>
                                        <button onClick={() => setModal('send')} className="text-blue-400">تغيير <i className="fas fa-chevron-down mr-1"></i></button>
                                    </div>
                                    <div className="flex items-center gap-4">
                                        <i className={`fas ${SEND_METHODS[sendVia].icon} text-2xl w-8 text-center`}></i>
                                        <input 
                                            type="number" 
                                            value={amount}
                                            onChange={(e) => setAmount(e.target.value)}
                                            placeholder="0.00" 
                                            className="bg-transparent text-3xl font-black outline-none w-full"
                                        />
                                    </div>
                                </div>

                                <div className="neo-card p-5 space-y-4 border-t-4 border-t-blue-500">
                                    <div className="flex justify-between text-[10px] font-bold text-gray-500 uppercase">
                                        <span>تستلم</span>
                                        <button onClick={() => setModal('receive')} className="text-blue-400">تغيير <i className="fas fa-chevron-down mr-1"></i></button>
                                    </div>
                                    <div className="flex items-center justify-between">
                                        <span className="text-3xl font-black text-blue-400">{results.final.toFixed(2)}</span>
                                        <span className="font-bold text-sm text-gray-400">{RECEIVE_METHODS[receiveVia].currency}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Wallet Info */}
                            <div className="neo-card p-5">
                                <input 
                                    type="text" 
                                    value={wallet}
                                    onChange={(e) => setWallet(e.target.value)}
                                    placeholder={`أدخل رقم ${RECEIVE_METHODS[receiveVia].name}...`}
                                    className="w-full bg-white/5 p-4 rounded-xl text-center text-sm outline-none border border-white/5 focus:border-blue-500"
                                />
                            </div>

                            <button 
                                onClick={handleSwap}
                                className={`w-full py-5 rounded-2xl text-lg font-black shadow-lg ${sendVia === 'stars' ? 'btn-star shadow-yellow-500/10' : 'btn-blue shadow-blue-500/10'}`}
                            >
                                {sendVia === 'stars' ? <><i className="fas fa-star ml-2"></i> تأكيد ودفع النجوم</> : 'تأكيد التبديل'}
                            </button>

                            {/* Referral Section */}
                            <div className="referral-box p-6 rounded-[2rem] space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-black italic text-blue-400">برنامج الشركاء</h3>
                                    <span className="text-[10px] bg-white/10 px-2 py-1 rounded-md">عمولتك: 5%</span>
                                </div>
                                <p className="text-[10px] text-gray-500">شارك رابطك واحصل على 5% من كل عملية تبادل يقوم بها أصدقاؤك فوراً.</p>
                                <div className="flex items-center gap-2">
                                    <div className="flex-1 bg-black/50 p-3 rounded-lg text-[9px] font-mono truncate text-gray-400">
                                        t.me/Bot?start={user?.id}
                                    </div>
                                    <button onClick={copyRef} className="p-3 bg-blue-600 rounded-lg text-xs"><i className="fas fa-copy"></i></button>
                                </div>
                                <div className="text-center text-[10px] font-bold">عدد إحالاتك: <span className="text-blue-500">{refCount}</span></div>
                            </div>
                        </div>
                    ) : (
                        <div className="p-5 animate-fade">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-black italic text-red-500">سجل العمليات</h2>
                                <button onClick={() => setPage('exchange')} className="text-xs font-bold text-gray-500">إغلاق</button>
                            </div>
                            {/* هنا يتم جلب الطلبات من Firebase كما في الكود السابق */}
                            <div className="text-center py-20 text-gray-600 text-xs">لا يوجد طلبات جديدة حالياً</div>
                        </div>
                    )}

                    {/* Footer Nav */}
                    <div className="fixed bottom-6 left-6 right-6 h-16 glass rounded-2xl flex items-center justify-around px-4">
                        <button onClick={() => setPage('exchange')} className={`flex flex-col items-center gap-1 ${page === 'exchange' ? 'text-blue-500' : 'text-gray-500'}`}>
                            <i className="fas fa-bolt"></i><span className="text-[8px] font-black uppercase">تبادل</span>
                        </button>
                        <button onClick={() => tg.openLink('https://t.me/YOUR_SUPPORT')} className="flex flex-col items-center gap-1 text-gray-500">
                            <i className="fas fa-question-circle"></i><span className="text-[8px] font-black uppercase">مساعدة</span>
                        </button>
                    </div>

                    {/* Modals */}
                    {modal && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/80 backdrop-blur-sm" onClick={() => setModal(null)}>
                            <div className="w-full max-w-sm glass rounded-t-[3rem] p-8 animate-slide" onClick={e => e.stopPropagation()}>
                                <h3 className="text-center font-black mb-6 uppercase text-xs tracking-widest text-gray-500">اختر الوسيلة</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    {Object.entries(modal === 'send' ? SEND_METHODS : RECEIVE_METHODS).map(([id, data]) => (
                                        <button key={id} onClick={() => { modal === 'send' ? setSendVia(id) : setReceiveVia(id); setModal(null); }} className="flex flex-col items-center gap-2 p-4 rounded-2xl bg-white/5 border border-white/5">
                                            <span className="text-[10px] font-bold text-center">{data.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
